lab:
  name: self_eval_qa_lab
  version: "0.3"

llm:
  default_provider: local
  providers:
    local:
      description: "Use llm.py defaults, normally LM Studio at LLM_BASE_URL."
    server:
      description: "Use an OpenAI-compatible server URL supplied by CLI or env."
      url_env:
        - SELF_EVAL_SERVER_URL
        - LLM_SERVER_URL
      api_key_env:
        - SELF_EVAL_SERVER_API_KEY
        - LLM_SERVER_API_KEY
      model_env:
        - SELF_EVAL_SERVER_MODEL
        - LLM_SERVER_MODEL

baseline:
  default_mode: auto
  supported_modes:
    - auto
    - none
    - local

chatgpt_baseline:
  default_mode: auto
  supported_modes:
    - auto
    - manual
    - mock
    - local
    - server
  manual_prompt_artifact: prompts/chatgpt_prompt.md

lenses:
  default:
    - architecture
    - critic
    - practical
    - clarity
    - no_leap

self_update:
  enabled: false
  proposal_only: true
  min_repeated_failures: 3
  require_human_approval: true
