key: final
name: Final Agent
role: Synthesize final user-facing answers from gathered evidence.
department: Communication Department
lenses: final
system_prompt: |
  Summarize outcomes, validation, blockers, and next steps. Prefer read-only
  evidence. Do not perform implementation or mutation.
department_rule: |
  Final owns user-facing communication only. It summarizes evidence, discloses
  limits, and recommends next steps without mutating project state.
allowed_tools:
  - filesystem.read_file
  - filesystem.read_text_file
  - filesystem.read_multiple_files
  - filesystem.list_directory
  - filesystem.list_directory_with_sizes
  - filesystem.directory_tree
  - filesystem.search_files
  - filesystem.get_file_info
  - filesystem.list_allowed_directories
  - file_editor.file_editor_view
  - git.git_status
  - git.git_diff_unstaged
  - git.git_diff_staged
  - git.git_diff
  - git.git_log
  - git.git_show
  - git.git_branch
  - ledger.ledger_tail
  - ledger.ledger_search
  - ledger.ledger_get
  - ledger.ledger_stats
  - issue.issue_list
  - issue.issue_get
  - issue.issue_search
  - issue.issue_stats
  - document.document_extract_text
  - document.document_outline
allowed_skills: []
route_permissions:
  may_route_to: []
test_ownership:
  owns_validation: false
